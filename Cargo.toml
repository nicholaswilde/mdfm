[package]
name = "mdfm"
version = "0.1.2"
edition = "2021"
authors = ["Nicholas Wilde"]
description = "jq for Markdown frontmatter: query, mutate, delete, and validate YAML and TOML frontmatter without modifying the Markdown body"
license = "Apache-2.0"
repository = "https://github.com/nicholaswilde/mdfm"
homepage = "https://nicholaswilde.io/mdfm"
readme = "docs/README.md"
keywords = ["markdown", "frontmatter", "yaml", "toml", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "mdfm"
path = "src/lib.rs"

[[bin]]
name = "mdfm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.3.3"
comfy-table = "7.1"
globset = "0.4"
ignore = "0.4"
jsonschema = { version = "0.29", default-features = false }
owo-colors = { version = "4.2", features = ["supports-colors"] }
self_update = { version = "1.3.3", default-features = false, features = [
  "ureq",
  "rustls",
  "progress-bar",
  "github",
  "archive-tar",
  "compression-tar-gz",
  "archive-zip",
  "compression-zip-deflate",
  "checksums",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"

# Profile for final production releases (smaller, faster)
[profile.release]
opt-level = "z"   # Optimize for size
lto = true        # Link Time Optimization (smaller binary)
codegen-units = 1 # Reduce parallel code generation for better optimization
panic = "abort"   # Remove stack unwinding (smaller binary)
strip = true      # Strip symbols (smaller binary)

# Profile for CI/CD builds (inherits from dev)
[profile.ci]
inherits = "dev"
incremental = false # Disable incremental compilation for CI (often slower/buggy in CI cache)
debug = 0           # No debug info needed for basic CI checks (speeds up build)

[package.metadata.deb]
maintainer = "Nicholas Wilde <ncwilde43@gmail.com>"
copyright = "2026 Nicholas Wilde"
license-file = ["LICENSE", "4"]
extended-description = "jq for Markdown frontmatter: query, mutate, delete, and validate YAML and TOML frontmatter across Markdown files without modifying the Markdown body or line endings."
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/mdfm",
    "usr/bin/",
    "755",
  ],
  [
    "assets/mdfm.1",
    "usr/share/man/man1/",
    "644",
  ],
  [
    "docs/README.md",
    "usr/share/doc/mdfm/README.md",
    "644",
  ],
  [
    "completions/mdfm.bash",
    "usr/share/bash-completion/completions/mdfm",
    "644",
  ],
  [
    "completions/_mdfm",
    "usr/share/zsh/vendor-completions/_mdfm",
    "644",
  ],
  [
    "completions/mdfm.fish",
    "usr/share/fish/vendor_completions.d/mdfm.fish",
    "644",
  ],
]
