# =============================================================================
# mdfm Configuration Example (config.example.toml)
# =============================================================================
# Copy this file to .mdfm.toml in your project root or to
# ~/.config/mdfm/config.toml (or %APPDATA%\mdfm\config.toml on Windows)
# to customize default behavior.
#
# Settings resolve in precedence order:
#   CLI Flags > Environment Variables > Project-Local .mdfm.toml > User Global Config > Defaults
# =============================================================================

# Default frontmatter format when creating new frontmatter on files without any.
# Supported values: "yaml" (default), "toml"
# CLI: --format <yaml|toml> | Env: MDFM_FORMAT
# default_format = "yaml"

# Output format for command results.
# Supported values: "table" (default), "json", "plain", "files"
# CLI: --output <table|json|plain|files> (or -l / --files-only) | Env: MDFM_OUTPUT
# output = "table"

# Default JSON Schema path for `mdfm check`.
# CLI: --schema <path> | Env: MDFM_SCHEMA
# schema = ".mdfm-schema.json"

# Glob patterns to exclude when walking directories (in addition to .gitignore).
# ignore = ["drafts/**", "CHANGELOG.md"]

# File extensions to discover during directory walks (case-insensitive, leading '.' optional).
# CLI: --ext <ext> (repeatable or comma-separated)
# extensions = ["md", "markdown"]

# Only show validation failures and a compact summary line in `mdfm check`.
# CLI: --errors-only | -q | --quiet
# errors_only = false

# Indent YAML sequence items (`- `) under their parent key (shared by fmt, set, del, mv).
# CLI (fmt): --indent-sequences <true|false>
# indent_sequences = true

# Number of spaces per YAML indentation level (must be >= 1; shared by fmt, set, del, mv).
# CLI (fmt): --yaml-indent <spaces>
# yaml_indent = 2

# Recursively sort frontmatter keys alphabetically in `mdfm fmt`.
# CLI (fmt): --sort-keys
# sort_keys = false

# Dot-path array keys to sort and deduplicate in `mdfm fmt`.
# CLI (fmt): --sort-array <key>
# sort_arrays = ["tags"]

# Per-glob JSON Schemas for `mdfm check` (evaluated in order; falls back to `schema`).
# Explicit CLI `--schema` or `MDFM_SCHEMA` overrides all `[[schemas]]` entries.
# [[schemas]]
# pattern = "docs/reference/**"
# schema = ".mdfm-reference-schema.json"
#
# [[schemas]]
# patterns = ["cook/**/*.cook", "recipes/*.cook"]
# schema = ".mdfm-cook-schema.json"
